<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="16" height="16">
  <!-- dark outline -->
  <rect x="4" y="1" width="8" height="1" fill="#2D1B36"/>
  <rect x="3" y="2" width="1" height="1" fill="#2D1B36"/>
  <rect x="12" y="2" width="1" height="1" fill="#2D1B36"/>
  <rect x="2" y="3" width="1" height="1" fill="#2D1B36"/>
  <rect x="13" y="3" width="1" height="1" fill="#2D1B36"/>
  <rect x="1" y="4" width="1" height="8" fill="#2D1B36"/>
  <rect x="14" y="4" width="1" height="8" fill="#2D1B36"/>
  <rect x="2" y="12" width="12" height="1" fill="#2D1B36"/>
  <rect x="3" y="13" width="10" height="1" fill="#2D1B36"/>
