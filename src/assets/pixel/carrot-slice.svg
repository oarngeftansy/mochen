<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="16" height="16">
  <!-- outline (round cross-section) -->
  <rect x="6" y="1" width="4" height="1" fill="#2D1B36"/>
  <rect x="4" y="2" width="2" height="1" fill="#2D1B36"/>
  <rect x="10" y="2" width="2" height="1" fill="#2D1B36"/>
  <rect x="3" y="3" width="1" height="1" fill="#2D1B36"/>
  <rect x="12" y="3" width="1" height="1" fill="#2D1B36"/>
  <rect x="2" y="4" width="1" height="2" fill="#2D1B36"/>
  <rect x="13" y="4" width="1" height="2" fill="#2D1B36"/>
  <rect x="1" y="6" width="1" height="4" fill="#2D1B36"/>
  <rect x="14" y="6" width="1" height="4" fill="#2D1B36"/>
  <rect x="2" y="10" width="1" height="2" fill="#2D1B36"/>
  <rect x="13" y="10" width="1" height="2" fill="#2D1B36"/>
  <rect x="3" y="12" width="1" height="1" fill="#2D1B36"/>
  <rect x="12" y="12" width="1" height="1" fill="#2D1B36"/>
  <rect x="4" y="13" width="2" height="1" fill="#2D1B36"/>
  <rect x="10" y="13" width="2" height="1" fill="#2D1B36"/>
  <rect x="6" y="14" width="4" height="1" fill="#2D1B36"/>
  <!-- outer dark orange -->
  <rect x="6" y="2" width="4" height="1" fill="#C56A0E"/>
  <rect x="4" y="3" width="8" height="1" fill="#C56A0E"/>
  <rect x="3" y="4" width="1" height="8" fill="#C56A0E"/>
  <rect x="12" y="4" width="1" height="8" fill="#C56A0E"/>
  <rect x="4" y="12" width="8" height="1" fill="#C56A0E"/>
  <rect x="6" y="13" width="4" height="1" fill="#C56A0E"/>
  <!-- outer orange flesh -->
  <rect x="4" y="4" width="8" height="8" fill="#E8842F"/>
  <!-- inner ring -->
  <rect x="5" y="5" width="6" height="1" fill="#F2A03A"/>
  <rect x="5" y="10" width="6" height="1" fill="#F2A03A"/>
  <rect x="5" y="6" width="1" height="4" fill="#F2A03A"/>
  <rect x="10" y="6" width="1" height="4" fill="#F2A03A"/>
  <!-- core (lighter) -->
  <rect x="6" y="6" width="4" height="4" fill="#FFB766"/>
  <!-- bull's eye -->
  <rect x="7" y="7" width="2" height="2" fill="#F2A03A"/>
  <!-- highlight -->
  <rect x="4" y="4" width="2" height="1" fill="#FFB766"/>
</svg>
